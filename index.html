<!-- PeerJS for online multiplayer (cross-phone P2P, no backend needed) -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>
(()=>{
'use strict';

// ─────────────────────────────────────────────────────────────
// PERSISTENT DATA
// ─────────────────────────────────────────────────────────────
let bestScore = +(localStorage.getItem('sr_best') || 0);
let soundOn = localStorage.getItem('sr_sound') !== '0';

// ─────────────────────────────────────────────────────────────
// CANVAS
// ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 720, H = 1280;
function setupDPI() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
}
setupDPI();
window.addEventListener('resize', setupDPI);

// ─────────────────────────────────────────────────────────────
// AUDIO ENGINE
// ─────────────────────────────────────────────────────────────
let actx = null;
function getAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) actx = new AC();
  }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function playTone(freq, type='sine', dur=0.15, vol=0.1, slide=null) {
  if (!soundOn) return;
  const ac = getAudio(); if (!ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide), ac.currentTime+dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime+dur);
  } catch(e){}
}
function playChord(freqs, type='triangle', dur=0.4, vol=0.08) {
  if (!soundOn) return;
  freqs.forEach((f,i)=>setTimeout(()=>playTone(f,type,dur,vol),i*45));
}
function playBoom() {
  if (!soundOn) return;
  const ac = getAudio(); if (!ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(90,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(20,ac.currentTime+0.45);
    g.gain.setValueAtTime(0.22,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.45);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime+0.45);
  } catch(e){}
}
function vibrate(ms=25) { if(navigator.vibrate) try{navigator.vibrate(ms)}catch(e){} }

// BGM
let bgmT=0, bgmB=0;
function updateBGM(dt) {
  if (!soundOn || gameState!=='play') return;
  bgmT+=dt;
  if (bgmT>=0.38) {
    bgmT-=0.38; bgmB=(bgmB+1)%8;
    if (bgmB===0||bgmB===4) playTone(52,'triangle',0.25,0.05,28);
    else if (bgmB===2||bgmB===6) playTone(160,'sine',0.08,0.02,80);
  }
}

// ─────────────────────────────────────────────────────────────
// GAME CONSTANTS
// ─────────────────────────────────────────────────────────────
const TRIAGE = {
  CRITICAL: { key:'critical', name:'CRITICAL', color:'#ff334b', dark:'#5e0b16', life:9, pts:200, healTime:1.9, wallHeal:16, damage:32, icon:'💀' },
  URGENT:   { key:'urgent',   name:'URGENT',   color:'#ffb300', dark:'#523800', life:13, pts:130, healTime:1.6, wallHeal:12, damage:24, icon:'⚡' },
  MINOR:    { key:'minor',    name:'MINOR',    color:'#00e676', dark:'#004722', life:17, pts:85,  healTime:1.3, wallHeal:9,  damage:18, icon:'🛡️' }
};

const ARCHETYPES = {
  STANDARD: { id:'standard', name:'Knight' },
  PRINCE:   { id:'prince',   name:'Royal Prince',  bonus:'👑 +400 PTS & +30% WALL!', crown:true },
  ARCHER:   { id:'archer',   name:'Longbow Archer', bonus:'🏹 DEFENDS BATTLEMENTS!',  bow:true },
  PLAGUE:   { id:'plague',   name:'Cursed Knight',  bonus:'☣️ PURIFY QUICKLY!',        cursed:true },
  VANGUARD: { id:'vanguard', name:'Iron Vanguard',  bonus:'🛡️ HEAVY FORTIFICATION',   heavy:true },
  BERSERKER:{ id:'berserker',name:'Berserker',      bonus:'💢 RAGES IF SLOW!',         rage:true },
  SENTINEL: { id:'sentinel', name:'Sentinel',       bonus:'🔔 RALLY ON HEAL!',         sentinel:true }
};

// 20 SOLO WAVES — escalating brutally, then INFINITE beyond wave 20
const WAVES = [
  { wave:1,  name:'First Skirmish',          knights:6,  rate:3.5,  catapults:false, weather:'clear' },
  { wave:2,  name:'Catapult Barrage',         knights:9,  rate:3.0,  catapults:true,  weather:'smoke' },
  { wave:3,  name:'Storming the Gates',       knights:12, rate:2.6,  catapults:true,  weather:'storm' },
  { wave:4,  name:'Iron Rain',                knights:14, rate:2.2,  catapults:true,  weather:'fire'  },
  { wave:5,  name:'The Plague Wave',          knights:16, rate:1.9,  catapults:true,  weather:'siege' },
  { wave:6,  name:'Twin Catapult Hell',       knights:19, rate:1.6,  catapults:true,  weather:'fire',  doubleCat:true },
  { wave:7,  name:'Assault On All Fronts',    knights:22, rate:1.35, catapults:true,  weather:'siege', doubleCat:true },
  { wave:8,  name:'Berserker Horde',          knights:25, rate:1.1,  catapults:true,  weather:'storm', doubleCat:true, rageMod:true },
  { wave:9,  name:'Siege of the Citadel',     knights:28, rate:0.9,  catapults:true,  weather:'siege', doubleCat:true, rageMod:true },
  { wave:10, name:'The First True Stand',     knights:32, rate:0.78, catapults:true,  weather:'siege', doubleCat:true, rageMod:true, finalStand:true },
  { wave:11, name:'Hellfire Advance',         knights:34, rate:0.72, catapults:true,  weather:'fire',  doubleCat:true, rageMod:true },
  { wave:12, name:'Plague Berserker Rush',    knights:36, rate:0.66, catapults:true,  weather:'siege', doubleCat:true, rageMod:true },
  { wave:13, name:'The Iron Flood',           knights:38, rate:0.60, catapults:true,  weather:'storm', doubleCat:true, rageMod:true, finalStand:true },
  { wave:14, name:'Warlord\'s Wrath',         knights:40, rate:0.55, catapults:true,  weather:'siege', doubleCat:true, rageMod:true },
  { wave:15, name:'Midnight Siege',           knights:42, rate:0.50, catapults:true,  weather:'siege', doubleCat:true, rageMod:true, finalStand:true },
  { wave:16, name:'The Blood Moon',           knights:45, rate:0.46, catapults:true,  weather:'fire',  doubleCat:true, rageMod:true, finalStand:true },
  { wave:17, name:'Infernal Breach',          knights:48, rate:0.42, catapults:true,  weather:'siege', doubleCat:true, rageMod:true, finalStand:true },
  { wave:18, name:'Siege Engine Storm',       knights:52, rate:0.38, catapults:true,  weather:'storm', doubleCat:true, rageMod:true, finalStand:true },
  { wave:19, name:'The Warlord Himself',      knights:56, rate:0.34, catapults:true,  weather:'siege', doubleCat:true, rageMod:true, finalStand:true },
  { wave:20, name:'⚔️ ULTIMATE SIEGE',        knights:65, rate:0.28, catapults:true,  weather:'siege', doubleCat:true, rageMod:true, finalStand:true }
];

// Generates a procedural infinite wave beyond wave 20
function getInfiniteWave(waveNum) {
  const n = waveNum - 20; // how many waves past 20
  return {
    wave: waveNum,
    name: `♾️ ENDLESS WAVE ${waveNum}`,
    knights: 65 + n * 8,
    rate: Math.max(0.18, 0.28 - n * 0.008),
    catapults: true,
    weather: ['siege','fire','storm','siege','fire'][n % 5],
    doubleCat: true,
    rageMod: true,
    finalStand: true,
    endless: true
  };
}

// Returns the correct wave data, generating infinite waves past 20
function getWaveData(waveNum) {
  if (waveNum <= WAVES.length) return WAVES[waveNum - 1];
  return getInfiniteWave(waveNum);
}

let infiniteMode = false; // unlocks after clearing wave 20

// ─────────────────────────────────────────────────────────────
// GAME STATE
// ─────────────────────────────────────────────────────────────
let gameState = 'home'; // home | howtoplay | roleselect | online | play | pause | reward | victory | gameover
let gameMode  = 'solo'; // solo | vs | online
let playerRole = 'defender'; // which role the LOCAL player has in online mode: attacker | defender

// For 1v1 local & online
let vsTimeLeft = 120;
let vsWinner = null;

// Attacker (6 skills now)
let attackerSkills = {
  catapult:    { name:'Catapult',      icon:'🪨', cooldown:3.5,  timer:0, dmg:9  },
  arrowVolley: { name:'Fire Arrows',   icon:'🏹', cooldown:5.5,  timer:0, dmg:11 },
  ladderRush:  { name:'Ladders',       icon:'🪜', cooldown:8.0,  timer:0, dmg:16 },
  plagueBomb:  { name:'Plague Bomb',   icon:'☣️', cooldown:11.0, timer:0 },
  siegeTower:  { name:'Siege Tower',   icon:'🏗️', cooldown:18.0, timer:0, dmg:28 },
  assassin:    { name:'Assassin',      icon:'🗡️', cooldown:22.0, timer:0, dmg:0  }
};

// Defender skills (4 total — defender-favored: "I MUST WIN O")
let skills = {
  elixir:  { name:'Miracle Elixir',  icon:'🧪', cooldown:18, timer:0 },          // buffed from 25→18
  shield:  { name:'Gate Barricade',  icon:'🛡️', cooldown:32, timer:0, activeTime:0 }, // shield duration 9s
  rally:   { name:'Rally!',          icon:'🔔', cooldown:28, timer:0 },           // NEW: extends all bleedout timers
  fortress:{ name:'Stone Fortress',  icon:'🏰', cooldown:45, timer:0 }            // NEW: instant +25 wall HP repair
};

// Relics
let playerRelics = [];
let perks = { healMult:1.0, lifeMult:1.0, wallArmor:0, autoHeal:0, comboBonus:1.0 };

const ALL_RELICS = [
  { id:'salve',    name:'ROYAL FIELD SALVE',   desc:'+55% Faster Bandage & Healing Speed', icon:'🍯', apply: p=>{ p.healMult+=0.55; } },
  { id:'bastion',  name:'GRANITE BASTION',      desc:'+30 Wall Max HP & +15 HP Repair/Wave', icon:'🧱', apply:(p,g)=>{ g.maxWallHP+=30; g.wallHP=Math.min(g.maxWallHP,g.wallHP+30); p.wallArmor+=15; } },
  { id:'tincture', name:'HERBAL TINCTURE',      desc:'+45% Patient Bleedout Survival Timers', icon:'🌿', apply: p=>{ p.lifeMult+=0.45; } },
  { id:'order',    name:'APOTHECARY ORDER',     desc:'Beds auto-treat patients over time', icon:'✨', apply: p=>{ p.autoHeal+=0.45; } },
  { id:'horn',     name:'WARHORN OF VALOR',     desc:'Combos grant +60% extra wall repair & pts', icon:'🎺', apply: p=>{ p.comboBonus+=0.6; } },
  { id:'sanctum',  name:'HEALING SANCTUM',      desc:'All beds gain 2nd tap-heal charge for free', icon:'🕍', apply: p=>{ p.doubleTap=true; } },
  { id:'phoenix',  name:'PHOENIX DRAUGHT',      desc:'First time wall reaches 0, restore 25 HP once per wave', icon:'🔥', apply: p=>{ p.phoenix=true; } },
  { id:'amulet',   name:'MEDIC\'S AMULET',      desc:'Killed knights deal 40% less wall damage', icon:'🔮', apply: p=>{ p.damageMult=0.6; } }
];
let rewardOptions = [];

// Entities
let queueKnights = [];
let beds = [
  { idx:0, type:TRIAGE.CRITICAL, x:130, y:730, w:170, h:220, patient:null, treatProgress:0, isHealing:false },
  { idx:1, type:TRIAGE.URGENT,   x:360, y:730, w:170, h:220, patient:null, treatProgress:0, isHealing:false },
  { idx:2, type:TRIAGE.MINOR,    x:590, y:730, w:170, h:220, patient:null, treatProgress:0, isHealing:false }
];

// Game numbers
let currentWave=1, wallHP=120, maxWallHP=120, score=0, combo=0, maxCombo=0;
let knightsSaved=0, knightsLost=0, waveKnightsSaved=0, waveKnightsLost=0, waveSpawned=0, spawnTimer=0.6;
let globalTime=0, screenShake=0, tutorialStep=1, selectedQueueKnight=null, gameOverReason='';
let assassinActive=false, assassinTimer=0;

// Particles & effects
let particles=[], floatingTexts=[], catapultRocks=[], archerArrows=[];
let wallDefenders=[], siegeEmbers=[], stormRain=[], lightningFlash=0;

// Atmospheric init
for (let i=0;i<45;i++) siegeEmbers.push({ x:Math.random()*W, y:Math.random()*H, vy:-(15+Math.random()*35), vx:(Math.random()-.5)*15, size:1+Math.random()*2.5, alpha:0.2+Math.random()*0.7 });
for (let i=0;i<60;i++) stormRain.push({ x:Math.random()*W, y:Math.random()*H, speed:550+Math.random()*300, len:12+Math.random()*10 });

// ─────────────────────────────────────────────────────────────
// ONLINE MULTIPLAYER (PeerJS WebRTC)
// ─────────────────────────────────────────────────────────────
let peer = null, conn = null;
let onlineState = 'idle'; // idle | hosting | joining | connected | error
let roomCode = '';
let onlineRole = 'defender'; // local player's role in online game
let roomCodeInput = ''; // typed room code (virtual)
let roomCodeInputActive = false;
let onlineStatus = '';

function initPeer() {
  if (peer) { try{ peer.destroy(); }catch(e){} }
  const id = Math.random().toString(36).substring(2,8).toUpperCase();
  peer = new Peer(id, {
    host: '0.peerjs.com', port: 443, secure: true,
    config: { iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}] }
  });
  peer.on('open', pid => {
    roomCode = pid;
    onlineStatus = 'Room code: ' + roomCode + '\nShare with opponent!';
    onlineState = 'hosting';
  });
  peer.on('connection', c => { setupConn(c); });
  peer.on('error', err => {
    onlineStatus = 'Connection error: ' + err.type;
    onlineState = 'error';
  });
}

function joinPeer(code) {
  if (!peer) {
    const id2 = Math.random().toString(36).substring(2,8).toUpperCase();
    peer = new Peer(id2, {
      host:'0.peerjs.com', port:443, secure:true,
      config:{ iceServers:[{urls:'stun:stun.l.google.com:19302'}] }
    });
    peer.on('open', () => {
      const c = peer.connect(code.toUpperCase());
      setupConn(c);
      onlineStatus = 'Connecting to ' + code + '...';
      onlineState = 'joining';
    });
    peer.on('error', err => {
      onlineStatus = 'Error: ' + err.type;
      onlineState = 'error';
    });
  }
}

function setupConn(c) {
  conn = c;
  conn.on('open', () => {
    onlineState = 'connected';
    onlineStatus = 'Connected! Starting game...';
    // Host is defender, joiner is attacker
    if (peer && roomCode && c.peer !== peer.id) {
      onlineRole = 'attacker';
    } else {
      onlineRole = 'defender';
    }
    setTimeout(() => {
      playerRole = onlineRole;
      startGame('online');
    }, 800);
  });
  conn.on('data', handleOnlineData);
  conn.on('close', () => {
    onlineStatus = 'Opponent disconnected!';
    if (gameState === 'play') {
      addFloatingText(360, 500, '📡 OPPONENT DISCONNECTED!', '#ff5252', 26);
    }
  });
}

function sendOnlineData(data) {
  if (conn && conn.open) {
    try { conn.send(data); } catch(e) {}
  }
}

function handleOnlineData(data) {
  if (!data || !data.type) return;
  if (data.type === 'skill') {
    // Attacker fired a skill — apply on defender screen
    if (playerRole === 'defender') {
      triggerAttackerSkill(data.key, true);
    }
  } else if (data.type === 'wallHP') {
    wallHP = data.v;
  } else if (data.type === 'score') {
    score = data.v;
  } else if (data.type === 'gameover') {
    vsWinner = data.winner;
    triggerVictory();
  }
}

// ─────────────────────────────────────────────────────────────
// GAME STATE MANAGEMENT
// ─────────────────────────────────────────────────────────────
function startGame(mode) {
  gameMode = mode;
  gameState = 'play';
  currentWave = 1;
  infiniteMode = false;
  // Defender advantage: start with 120 HP (not 100)
  maxWallHP = 120;
  wallHP = 120;
  score = 0; combo = 0; maxCombo = 0;
  knightsSaved = 0; knightsLost = 0;
  waveKnightsSaved = 0; waveKnightsLost = 0;
  waveSpawned = 0; spawnTimer = 0.7;
  screenShake = 0; selectedQueueKnight = null;
  assassinActive = false; assassinTimer = 0;
  playerRelics = [];
  perks = { healMult:1.0, lifeMult:1.0, wallArmor:0, autoHeal:0, comboBonus:1.0, doubleTap:false, phoenix:false, damageMult:1.0 };
  skills.elixir.timer = 0;
  skills.shield.timer = 0; skills.shield.activeTime = 0;
  skills.rally.timer = 0;
  skills.fortress.timer = 0;
  if (mode === 'vs' || mode === 'online') {
    vsTimeLeft = 120; vsWinner = null;
    for (let k in attackerSkills) attackerSkills[k].timer = 0;
  }
  queueKnights = [];
  beds.forEach(b=>{ b.patient=null; b.treatProgress=0; b.isHealing=false; });
  activeTouches.clear();
  particles=[]; floatingTexts=[]; catapultRocks=[]; wallDefenders=[]; archerArrows=[];
  tutorialStep = (bestScore===0 && mode==='solo') ? 1 : 0;
  addFloatingText(360,520, mode==='solo' ? '⚔️ WAVE 1: DEFEND THE KEEP!' : '⚔️ SIEGE DUEL BEGINS!', '#ffd875', 30);
  playTone(520,'triangle',0.25,0.15,780);
}

function restartCurrentWave() {
  gameState = 'play';
  wallHP = Math.min(maxWallHP, wallHP + 20);
  waveSpawned = 0; spawnTimer = 0.8;
  waveKnightsSaved = 0; waveKnightsLost = 0;
  selectedQueueKnight = null; assassinActive=false;
  queueKnights = [];
  beds.forEach(b=>{ b.patient=null; b.treatProgress=0; b.isHealing=false; });
  catapultRocks=[]; archerArrows=[];
  addFloatingText(360,520,`⚔️ WAVE ${currentWave} RESTARTED!`,'#ffd875',28);
  playTone(440,'triangle',0.2,0.1);
}

function spawnKnight(forceCursed=false, forceBerserker=false) {
  const waveData = getWaveData(currentWave);
  if (gameMode==='solo' && waveSpawned>=waveData.knights) return;

  // Triage distribution — later waves more critical
  const critChance = 0.30 + (currentWave-1)*0.022;
  const urgChance  = 0.40;
  let r = Math.random();
  let triage = r < critChance ? TRIAGE.CRITICAL : (r < critChance+urgChance ? TRIAGE.URGENT : TRIAGE.MINOR);

  let arch = ARCHETYPES.STANDARD;
  if (forceCursed) {
    arch = ARCHETYPES.PLAGUE;
  } else if (forceBerserker || (waveData.rageMod && Math.random()<0.28)) {
    arch = ARCHETYPES.BERSERKER;
  } else {
    const roll = Math.random();
    if      (roll<0.09 && currentWave>=2) arch = ARCHETYPES.PRINCE;
    else if (roll<0.22 && currentWave>=2) arch = ARCHETYPES.ARCHER;
    else if (roll<0.38 && currentWave>=3) arch = ARCHETYPES.PLAGUE;
    else if (roll<0.50 && currentWave>=3) arch = ARCHETYPES.VANGUARD;
    else if (roll<0.60 && currentWave>=5) arch = ARCHETYPES.SENTINEL;
  }

  const lifeScale = arch.heavy ? 1.3 : arch.cursed ? 0.75 : arch.rage ? 0.9 : 1.0;
  const baseLife = triage.life * perks.lifeMult * lifeScale;
  const knight = {
    id: Math.random().toString(36).substring(2,9),
    type: triage, arch,
    life: baseLife, maxLife: baseLife,
    x: 130+(queueKnights.length%4)*155,
    y: 1040+Math.floor(queueKnights.length/4)*110,
    targetX: 130+(queueKnights.length%4)*155,
    targetY: 1040+Math.floor(queueKnights.length/4)*110,
    dragged:false, inBed:null,
    isPurified:!arch.cursed,
    wounds: Math.floor(Math.random()*3)+1,
    bobOffset: Math.random()*Math.PI*2,
    rageBuilt: 0
  };
  queueKnights.push(knight);
  waveSpawned++;
  playTone(320,'sine',0.1,0.06,380);
  if (arch===ARCHETYPES.PRINCE)    addFloatingText(360,920,'👑 THE ROYAL PRINCE ARRIVES!','#ffd875',24), playChord([587,740,880],'triangle',0.3,0.15);
  else if (arch===ARCHETYPES.PLAGUE)    addFloatingText(360,920,'☣️ CURSED KNIGHT! PURIFY NOW!','#b388ff',22);
  else if (arch===ARCHETYPES.BERSERKER) addFloatingText(360,920,'💢 BERSERKER! TREAT FAST OR PAY!','#ff7043',22);
}

function handleKnightDeath(knight, bed=null) {
  knightsLost++; waveKnightsLost++; combo=0;
  let dmg = Math.round(knight.type.damage * (perks.damageMult||1.0));
  if (knight.arch===ARCHETYPES.PRINCE) dmg=Math.round(35*(perks.damageMult||1.0));
  if (knight.arch===ARCHETYPES.BERSERKER) dmg=Math.round(dmg*1.5);

  // Phoenix relic: once per wave save at 0 HP
  if (perks.phoenix && !perks.phoenixUsed) {
    perks.phoenixUsed = true;
    wallHP = 25;
    addFloatingText(360,400,'🔥 PHOENIX DRAUGHT ACTIVATES!','#ff9800',28);
    playChord([880,1174,1568],'sine',0.5,0.18);
  } else if (skills.shield.activeTime<=0) {
    wallHP = Math.max(0, wallHP - dmg);
  }

  screenShake=20; vibrate(70); playBoom();
  const px = bed ? bed.x : knight.x, py = bed ? bed.y : knight.y;
  createParticles(px,py,'#ff334b',28);
  addFloatingText(px,py-30,`-${dmg} WALL BREACH!`,'#ff334b',26);
  if (selectedQueueKnight===knight) selectedQueueKnight=null;
  if (bed) { bed.patient=null; bed.treatProgress=0; bed.isHealing=false; }
  else { queueKnights=queueKnights.filter(k=>k!==knight); }

  if (gameMode==='online') sendOnlineData({type:'wallHP',v:wallHP});

  if (wallHP<=0) {
    if (gameMode==='vs'||gameMode==='online') { vsWinner='attacker'; if(gameMode==='online') sendOnlineData({type:'gameover',winner:'attacker'}); triggerVictory(); }
    else triggerGameOver();
  }
}

function treatKnightSuccess(bed) {
  const p = bed.patient; if(!p) return;
  combo++; if(combo>maxCombo) maxCombo=combo;
  knightsSaved++; waveKnightsSaved++; vibrate(30);
  const cm = 1+Math.min(combo,12)*0.14*perks.comboBonus;
  let pts = Math.floor(p.type.pts*cm);
  let heal = Math.floor(p.type.wallHeal*(1+(combo>3?0.35:0)));
  if (p.arch===ARCHETYPES.PRINCE) { pts+=400; heal+=30; skills.shield.activeTime=9.0; addFloatingText(360,480,'👑 ROYAL SALVATION! SHIELD!','#ffd875',28); }
  if (p.arch===ARCHETYPES.VANGUARD) { heal+=15; addFloatingText(bed.x,bed.y-80,'🛡️ VANGUARD FORTIFIES!','#00e676',20); }
  if (p.arch===ARCHETYPES.SENTINEL) { addFloatingText(bed.x,bed.y-80,'🔔 SENTINEL RALLIES THE TROOPS!','#ffb300',20); skills.rally.timer=Math.max(0,skills.rally.timer-8); }
  score+=pts;
  wallHP=Math.min(maxWallHP,wallHP+heal);
  playChord([523,659,784,1046],'triangle',0.35,0.12);
  createParticles(bed.x,bed.y-20,'#00e676',25); createParticles(bed.x,bed.y-20,'#ffd875',15);
  addFloatingText(bed.x,bed.y-50,`+${pts} pts`,'#ffd875',26);
  addFloatingText(bed.x,bed.y-80,`+${heal} WALL`,'#00e676',20);
  if (combo>=3) addFloatingText(360,440,`🔥 COMBO x${combo}!`,'#ff9100',32);
  wallDefenders.push({ x:80+Math.random()*560, y:285+Math.random()*20, type:p.type, arch:p.arch, cheerTimer:p.arch===ARCHETYPES.ARCHER?20:6, shootTimer:0.8 });
  bed.patient=null; bed.treatProgress=0; bed.isHealing=false;
  if (gameMode==='online') sendOnlineData({type:'wallHP',v:wallHP});
  if (tutorialStep===2) tutorialStep=0;
}

    } else {
      addFloatingText(360,260,'🛡️ LADDERS REPELLED!','#ffd875',24);
    }
  } else if (key==='plagueBomb') {
    spawnKnight(true);
    addFloatingText(540,120,'☣️ PLAGUE BOMB!','#b388ff',22);
    playTone(480,'sawtooth',0.3,0.12,180);
  } else if (key==='siegeTower') {

      wallHP=Math.max(0,wallHP-sk.dmg);
      addFloatingText(360,280,`-${sk.dmg} SIEGE TOWER CRUSHES!`,'#ff1744',28);

    if(wallHP<=0) { vsWinner='attacker'; triggerVictory(); }

    addFloatingText(360,500,'🗡️ ASSASSIN IN THE INFIRMARY! 8s','#ff1744',26);
    playTone(660,'sawtooth',0.35,0.15,200);
    screenShake=12;
  }
}

// ─────────────────────────────────────────────────────────────
// WAVE MANAGEMENT
// ─────────────────────────────────────────────────────────────
function triggerWaveReward() {
  // After wave 20 in infinite mode, keep going forever; in normal mode wave 20 = victory
  if (currentWave >= WAVES.length && !infiniteMode) { triggerVictory(); return; }
  // In infinite mode, every 5 endless waves show a relic reward too
  if (currentWave >= WAVES.length && infiniteMode && (currentWave - WAVES.length) % 5 !== 0) {
    // Skip relic screen, just advance
    currentWave++; waveSpawned=0; waveKnightsSaved=0; waveKnightsLost=0; spawnTimer=1.0; gameState='play';
    addFloatingText(360,520,`♾️ ENDLESS WAVE ${currentWave} — ${getWaveData(currentWave).name}`,'#ff9800',26);
    playChord([587,740,880,1174],'triangle',0.4,0.15);
    return;
  }
  gameState='reward';
  rewardOptions=[...ALL_RELICS].sort(()=>Math.random()-.5).slice(0,3);
  playChord([440,554,659,880],'sine',0.5,0.12);
}
function selectRelic(idx) {
  const r=rewardOptions[idx]; if(!r) return;
  playerRelics.push(r);
  r.apply(perks,{maxWallHP,wallHP});
  perks.phoenixUsed=false; // reset phoenix each wave
  wallHP=Math.min(maxWallHP,wallHP+18+perks.wallArmor);
  currentWave++; waveSpawned=0; waveKnightsSaved=0; waveKnightsLost=0; spawnTimer=1.0;
  if (currentWave > WAVES.length) infiniteMode = true;
  gameState='play';
  const wd=getWaveData(currentWave);
  const prefix=wd.endless?'♾️':'🛡️';
  addFloatingText(360,520,`${prefix} WAVE ${currentWave} — ${wd.name}`,'#ffd875',26);
  playChord([587,740,880,1174],'triangle',0.4,0.15);
}
function triggerVictory() {
  gameState='victory';
  if(score>bestScore){ bestScore=score; localStorage.setItem('sr_best',bestScore); }
  vibrate([100,50,100,50,200]);
  playChord([523,659,784,1046,1318],'triangle',0.8,0.2);
}
function triggerGameOver(reason) {
  gameState='gameover';
  gameOverReason = reason || `Infirmary overwhelmed on Wave ${currentWave}${infiniteMode?' (Endless)':'/20'}.`;
  if(score>bestScore){ bestScore=score; localStorage.setItem('sr_best',bestScore); }
  vibrate(120);
  playTone(130,'sawtooth',0.8,0.25,45);
}

function createParticles(x,y,color,count=15) {
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, s=40+Math.random()*160;
    particles.push({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-20, size:3+Math.random()*5, color, alpha:1.0, decay:1.2+Math.random()*1.5 });
  }
}
function addFloatingText(x,y,text,color='#fff',size=22) {
  floatingTexts.push({ x,y, vy:-45, text, color, size, alpha:1.0, life:1.4 });
}
function spawnCatapultRock(big=false) {
  const sx=Math.random()>.5?-40:W+40, sy=80+Math.random()*100;
  const tx=120+Math.random()*480, ty=270+Math.random()*60;
  catapultRocks.push({ x:sx, y:sy, startX:sx, startY:sy, targetX:tx, targetY:ty, t:0, speed:0.55+Math.random()*0.35, size:(big?24:16)+Math.random()*8 });
}

// ─────────────────────────────────────────────────────────────
// UPDATE LOOP
// ─────────────────────────────────────────────────────────────
function update(dt) {
  globalTime+=dt;
  if(screenShake>0) screenShake=Math.max(0,screenShake-dt*45);
  for(let e of siegeEmbers){ e.y+=e.vy*dt; e.x+=e.vx*dt; if(e.y<-10){ e.y=H+10; e.x=Math.random()*W; } }
  if(gameState!=='play') return;

  updateBGM(dt);

  // Assassin debuff
  if(assassinActive){ assassinTimer-=dt; if(assassinTimer<=0){ assassinActive=false; addFloatingText(360,500,'🗡️ Assassin gone!','#ffd875',22); } }

  // VS / Online timers
  if(gameMode==='vs'||gameMode==='online'){
    vsTimeLeft-=dt;
    if(vsTimeLeft<=0){ vsWinner='defender'; if(gameMode==='online')sendOnlineData({type:'gameover',winner:'defender'}); triggerVictory(); return; }
    for(let k in attackerSkills){ if(attackerSkills[k].timer>0) attackerSkills[k].timer=Math.max(0,attackerSkills[k].timer-dt); }
  }

  // Defender skill cooldowns
  for(let s in skills){ if(skills[s].timer>0) skills[s].timer=Math.max(0,skills[s].timer-dt); }
  if(skills.shield.activeTime>0) skills.shield.activeTime=Math.max(0,skills.shield.activeTime-dt);

  const wd = getWaveData(currentWave);

  // Weather
  if(wd.weather==='storm'){
    for(let r of stormRain){ r.y+=r.speed*dt; r.x-=70*dt; if(r.y>H){r.y=-20;r.x=Math.random()*W;} }
    if(Math.random()<dt*0.35){ lightningFlash=0.35; playTone(70,'sawtooth',0.4,0.12,30); }
  }
  if(lightningFlash>0) lightningFlash=Math.max(0,lightningFlash-dt*1.5);

  // Spawn knights
  spawnTimer-=dt;
  if(spawnTimer<=0){
    if(gameMode==='vs'||gameMode==='online'){
      if(queueKnights.length<7) spawnKnight();
      spawnTimer=2.0;
    } else if(waveSpawned<wd.knights){
      spawnKnight();
      spawnTimer=wd.rate;
    }
  }

  // AI catapult (solo)
  if(gameMode==='solo'&&wd.catapults){
    const rate = wd.doubleCat ? dt*0.7 : dt*0.38;
    if(Math.random()<rate) spawnCatapultRock(wd.finalStand);
  }

  // Catapult rocks
  for(let i=catapultRocks.length-1;i>=0;i--){
    const rock=catapultRocks[i];
    rock.t+=dt*rock.speed;
    const arc=Math.sin(rock.t*Math.PI)*140;
    rock.x=rock.startX+(rock.targetX-rock.startX)*rock.t;
    rock.y=(rock.startY+(rock.targetY-rock.startY)*rock.t)-arc;
    if(Math.random()<0.6) particles.push({x:rock.x,y:rock.y,vx:(Math.random()-.5)*20,vy:(Math.random()-.5)*20,size:4+Math.random()*4,color:'#ff6d00',alpha:0.7,decay:2.0});
    // Archer intercept
    for(let j=archerArrows.length-1;j>=0;j--){
      const a=archerArrows[j];
      if(Math.hypot(a.x-rock.x,a.y-rock.y)<35){ createParticles(rock.x,rock.y,'#ffd875',20); addFloatingText(rock.x,rock.y-20,'🏹 SHOT DOWN!','#69f0ae',22); playTone(600,'triangle',0.15,0.1); catapultRocks.splice(i,1); archerArrows.splice(j,1); break; }
    }
    if(!catapultRocks[i]) continue;
    if(rock.t>=1.0){
      screenShake=Math.max(screenShake,14); playBoom();
      createParticles(rock.targetX,rock.targetY,'#ff7043',20); createParticles(rock.targetX,rock.targetY,'#90a4ae',15);
      if(skills.shield.activeTime>0){
        addFloatingText(rock.targetX,rock.targetY-20,'🛡️ BLOCKED!','#ffd875',22); playTone(300,'triangle',0.2,0.1);
      } else {
        const rockDmg=rock.size>24?12:8;
        wallHP=Math.max(0,wallHP-rockDmg);
        addFloatingText(rock.targetX,rock.targetY-20,`-${rockDmg} CATAPULT!`,'#ff5252',20);
        if(gameMode==='online') sendOnlineData({type:'wallHP',v:wallHP});
        if(wallHP<=0){ if(gameMode==='vs'||gameMode==='online'){vsWinner='attacker';if(gameMode==='online')sendOnlineData({type:'gameover',winner:'attacker'});triggerVictory();}else triggerGameOver(); }
      }
      catapultRocks.splice(i,1);
    }
  }

  // Archers shoot
  for(let d of wallDefenders){
    if(d.arch===ARCHETYPES.ARCHER&&catapultRocks.length>0){
      d.shootTimer-=dt;
      if(d.shootTimer<=0){ d.shootTimer=1.1; const t=catapultRocks[0]; archerArrows.push({x:d.x,y:d.y,tx:t.x,ty:t.y,t:0}); playTone(700,'sine',0.08,0.05,900); }
    }
  }
  for(let i=archerArrows.length-1;i>=0;i--){ const a=archerArrows[i]; a.t+=dt*3.5; a.x+=(a.tx-a.x)*(dt*5); a.y+=(a.ty-a.y)*(dt*5); if(a.t>=1.0) archerArrows.splice(i,1); }

  // Queue positioning & decay
  const activeQ=queueKnights.filter(k=>!k.dragged&&!k.inBed);
  activeQ.forEach((k,idx)=>{
    k.targetX=130+(idx%4)*155; k.targetY=1040+Math.floor(idx/4)*110;
    k.x+=(k.targetX-k.x)*Math.min(1,dt*12); k.y+=(k.targetY-k.y)*Math.min(1,dt*12);
    // Berserker: builds rage reducing life faster over time
    const decayMult = k.arch===ARCHETYPES.BERSERKER ? (1.0+Math.min(k.rageBuilt||0,2.5)) : 1.0;
    k.life-=dt*decayMult;
    if(k.arch===ARCHETYPES.BERSERKER) { k.rageBuilt=(k.rageBuilt||0)+dt*0.15; }
    if(k.life<=0) handleKnightDeath(k,null);
  });

  // Bed treatment
  beds.forEach(bed=>{
    if(!bed.patient) return;
    const p=bed.patient;
    const decayRate = bed.isHealing ? 0.28 : 1.0;
    p.life-=dt*decayRate;
    if(p.life<=0){ handleKnightDeath(p,bed); return; }

    if(perks.autoHeal>0&&p.isPurified){ bed.treatProgress+=dt*perks.autoHeal*perks.healMult; if(Math.random()<0.25) particles.push({x:bed.x+(Math.random()-.5)*60,y:bed.y+(Math.random()-.5)*40,vx:0,vy:-30,size:3,color:'#00e676',alpha:0.8,decay:1.5}); }

    if(bed.isHealing&&!assassinActive){
      if(!p.isPurified){ p.isPurified=true; createParticles(bed.x,bed.y,'#b388ff',15); addFloatingText(bed.x,bed.y-40,'✨ PURIFIED!','#b388ff',20); playTone(700,'triangle',0.15,0.1); }
      else{ bed.treatProgress+=dt*1.85*perks.healMult; if(Math.random()<0.4) particles.push({x:bed.x+(Math.random()-.5)*70,y:bed.y+(Math.random()-.5)*50,vx:(Math.random()-.5)*30,vy:-(20+Math.random()*40),size:4,color:'#ffd54f',alpha:0.9,decay:2.0}); }
    }
    if(bed.treatProgress>=p.type.healTime) treatKnightSuccess(bed);
  });

  for(let i=wallDefenders.length-1;i>=0;i--){ wallDefenders[i].cheerTimer-=dt; if(wallDefenders[i].cheerTimer<=0) wallDefenders.splice(i,1); }
  for(let i=particles.length-1;i>=0;i--){ const pt=particles[i]; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.alpha-=pt.decay*dt; if(pt.alpha<=0) particles.splice(i,1); }
  for(let i=floatingTexts.length-1;i>=0;i--){ const ft=floatingTexts[i]; ft.y+=ft.vy*dt; ft.life-=dt; ft.alpha=Math.max(0,ft.life/1.4); if(ft.life<=0) floatingTexts.splice(i,1); }

  if(gameMode==='solo'){
    const anyLeft=queueKnights.length>0||beds.some(b=>b.patient!==null);
    if(waveSpawned>=wd.knights&&!anyLeft){
      const minRequired = Math.max(1, Math.ceil(wd.knights * 0.5));
      if(waveKnightsSaved < minRequired || wallHP <= 0){
        triggerGameOver(`Infirmary Overrun! Saved ${waveKnightsSaved}/${wd.knights} (Min ${minRequired} needed).`);
      } else {
        triggerWaveReward();
      }
    }
  }
}

// ─────────────────────────────────────────────────────────────
// RENDERING
// ─────────────────────────────────────────────────────────────
function draw() {
  ctx.save();
  if(screenShake>0) ctx.translate((Math.random()-.5)*screenShake,(Math.random()-.5)*screenShake);

  const wd=getWaveData(currentWave);

  // Sky
  const sg=ctx.createLinearGradient(0,0,0,420);
  if(wd.weather==='storm'){ sg.addColorStop(0,'#04070d'); sg.addColorStop(0.6,'#0f1826'); sg.addColorStop(1,'#1a273b'); }
  else if(wd.weather==='fire'||wd.weather==='siege'||gameMode==='vs'||gameMode==='online'){ sg.addColorStop(0,'#08080f'); sg.addColorStop(0.6,'#281116'); sg.addColorStop(1,'#421614'); }
  else{ sg.addColorStop(0,'#060a12'); sg.addColorStop(0.5,'#101a28'); sg.addColorStop(1,'#2a1a1f'); }
  ctx.fillStyle=sg; ctx.fillRect(0,0,W,450);

  // Moon
  ctx.fillStyle='#ffecb3'; ctx.beginPath(); ctx.arc(620,80,26,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(631,75,24,0,Math.PI*2); ctx.fill();

  // Mountains
  ctx.fillStyle='#121620'; ctx.beginPath();
  ctx.moveTo(0,360); ctx.lineTo(90,310); ctx.lineTo(210,350); ctx.lineTo(340,280); ctx.lineTo(460,335); ctx.lineTo(600,295); ctx.lineTo(720,350); ctx.lineTo(720,420); ctx.lineTo(0,420); ctx.fill();

  if(lightningFlash>0){ ctx.fillStyle=`rgba(255,255,255,${lightningFlash})`; ctx.fillRect(0,0,W,H); }
  if(wd.weather==='storm'){ ctx.strokeStyle='rgba(174,213,249,0.35)'; ctx.lineWidth=1.5; for(let r of stormRain){ ctx.beginPath(); ctx.moveTo(r.x,r.y); ctx.lineTo(r.x-6,r.y+r.len); ctx.stroke(); } }

  drawCastleWall();
  drawInfirmaryInterior();
  beds.forEach(b=>drawBed(b));
  drawQueueArea();

  if((gameMode==='vs'||gameMode==='online')&&(playerRole==='attacker'||gameMode==='vs')) drawAttackerCommandBar();

  drawCatapultsAndProjectiles();

  activeTouches.forEach(t=>{
    if(t.dragKnight){
      const g=ctx.createRadialGradient(t.x,t.y,10,t.x,t.y,65);
      g.addColorStop(0,t.dragKnight.type.color+'aa'); g.addColorStop(1,'transparent');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(t.x,t.y,65,0,Math.PI*2); ctx.fill();
      drawKnightSprite(t.x,t.y,t.dragKnight,1.15,true);
    }
  });

  drawParticlesAndTexts();

  for(let e of siegeEmbers){ ctx.fillStyle='#ff9800'; ctx.globalAlpha=e.alpha; ctx.beginPath(); ctx.arc(e.x,e.y,e.size,0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1.0;

  // Assassin darken overlay
  if(assassinActive){
    ctx.fillStyle=`rgba(20,0,0,${0.35+Math.sin(globalTime*8)*0.1})`;
    ctx.fillRect(0,380,W,600);
    ctx.fillStyle='#ff1744'; ctx.font='bold 18px Georgia,serif'; ctx.textAlign='center';
    ctx.fillText(`🗡️ ASSASSIN! HEALING BLOCKED — ${Math.ceil(assassinTimer)}s`,360,700);
  }

  drawHUD();
  if(tutorialStep>0&&gameState==='play') drawTutorialHint();

  // State overlays
  if(gameState==='home')         drawHomeScreen();
  else if(gameState==='roleselect') drawRoleSelectScreen();
  else if(gameState==='online')  drawOnlineScreen();
  else if(gameState==='howtoplay') drawHowToPlayScreen();
  else if(gameState==='pause')   drawPauseScreen();
  else if(gameState==='reward')  drawRewardScreen();
  else if(gameState==='victory') drawEndScreen(true);
  else if(gameState==='gameover')drawEndScreen(false);

  ctx.restore();
}

function drawCastleWall() {
  ctx.fillStyle='#263238'; ctx.fillRect(0,240,W,140);
  ctx.strokeStyle='#1b2428'; ctx.lineWidth=2;
  for(let row=0;row<5;row++){
    const y=240+row*28; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    const off=(row%2)*45; for(let x=off;x<W;x+=90){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+28); ctx.stroke(); }
  }
  for(let i=0;i<9;i++){
    const x=12+i*80; ctx.fillStyle='#37474f'; ctx.fillRect(x,215,52,28);
    ctx.fillStyle='#546e7a'; ctx.fillRect(x,215,52,4);

  drawBanner(70,210,'#c62828','#ffd54f');

function drawBed(bed){
  ctx.save();
  const {x,y,w,h,type,patient,treatProgress}=bed; const col=type.color;
  ctx.fillStyle='rgba(16,24,35,0.88)'; roundRect(ctx,x-w/2,y-110,w,h+10,14); ctx.fill();
  ctx.strokeStyle=col; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle=type.dark; roundRect(ctx,x-72,y-102,144,28,14); ctx.fill();
  ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle='#ffffff'; ctx.font='bold 13px Georgia,serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(`${type.icon} ${type.name}`,x,y-88);
  ctx.fillStyle='#4e342e'; roundRect(ctx,x-55,y-50,110,130,8); ctx.fill(); ctx.strokeStyle='#8d6e63'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#eceff1'; roundRect(ctx,x-48,y-25,96,100,6); ctx.fill();
  ctx.fillStyle='#cfd8dc'; roundRect(ctx,x-42,y-44,84,24,6); ctx.fill();

  let isHovered=false;
  activeTouches.forEach(t=>{ if(t.dragKnight&&Math.hypot(t.x-x,t.y-y)<130) isHovered=true; });
  if(selectedQueueKnight&&selectedQueueKnight.type===type&&!patient) isHovered=true;
  if(isHovered&&!patient){ ctx.strokeStyle=col; ctx.lineWidth=4; ctx.setLineDash([8,6]); ctx.beginPath(); ctx.arc(x,y+10,85,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle=col+'33'; ctx.fill(); }

  if(patient){
    drawKnightSprite(x,y-2,patient,0.95,false);
    const progress=treatProgress/patient.type.healTime;
    const lr=Math.max(0,patient.life/patient.maxLife);
    ctx.fillStyle='rgba(0,0,0,0.6)'; roundRect(ctx,x-55,y+74,110,10,5); ctx.fill();
    ctx.fillStyle=lr>0.4?col:'#ff1744'; roundRect(ctx,x-55,y+74,110*lr,10,5); ctx.fill();
    if(!patient.isPurified){
      const p2=1+Math.sin(globalTime*10)*0.08; ctx.save(); ctx.translate(x,y+102); ctx.scale(p2,p2);
      ctx.fillStyle='#b388ff'; roundRect(ctx,-56,-13,112,26,13); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='900 11px Georgia,serif'; ctx.fillText('TAP TO PURIFY!',0,0); ctx.restore();
    } else if(treatProgress>0){
      ctx.beginPath(); ctx.arc(x,y+15,34,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,progress));
      ctx.strokeStyle = assassinActive ? '#ff1744' : '#00e676'; ctx.lineWidth=6; ctx.stroke();
      ctx.fillStyle=assassinActive?'#ff5252':'#00e676'; ctx.font='bold 12px Georgia,serif';
      ctx.fillText(assassinActive?'BLOCKED!':'TREATING...',x,y+102);
    } else {
      const p2=1+Math.sin(globalTime*8)*0.08; ctx.save(); ctx.translate(x,y+102); ctx.scale(p2,p2);
      ctx.fillStyle='#ffd54f'; roundRect(ctx,-56,-13,112,26,13); ctx.fill();
      ctx.fillStyle='#0a0f18'; ctx.font='900 11px Georgia,serif'; ctx.fillText('TAP TO HEAL!',0,0); ctx.restore();
    }
  } else {
    ctx.fillStyle='#78909c'; ctx.font='12px Georgia,serif'; ctx.fillText('EMPTY BED',x,y+25);
    ctx.font='10px Georgia,serif'; ctx.fillStyle='#546e7a'; ctx.fillText(selectedQueueKnight?'Tap To Place':'Drop Knight Here',x,y+42);
  }
  ctx.restore();
}

function drawKnightSprite(x,y,knight,scale=1.0,isDragging=false){
  ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
  const bob=isDragging?Math.sin(globalTime*15)*4:Math.sin(globalTime*4+knight.bobOffset)*2;
  ctx.translate(0,bob);
  const tc=knight.type.color;

  if(selectedQueueKnight===knight){
    ctx.strokeStyle='#ffd875'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,0,48,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='rgba(255,216,117,0.2)'; ctx.fill();
  }
  if(knight.arch===ARCHETYPES.PLAGUE&&!knight.isPurified){
    const m=ctx.createRadialGradient(0,0,5,0,0,45);
    m.addColorStop(0,'rgba(179,136,255,0.6)'); m.addColorStop(1,'transparent');
    ctx.fillStyle=m; ctx.beginPath(); ctx.arc(0,0,45,0,Math.PI*2); ctx.fill();
  }
  if(knight.arch===ARCHETYPES.BERSERKER){
    const rage=Math.min(1,(knight.rageBuilt||0));
    ctx.fillStyle=`rgba(255,60,0,${rage*0.35})`; ctx.beginPath(); ctx.arc(0,0,50,0,Math.PI*2); ctx.fill();
  }

  ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(0,28,26,10,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=knight.arch===ARCHETYPES.PRINCE?'#ffd875':tc; roundRect(ctx,-18,-14,36,36,6); ctx.fill();
  ctx.fillStyle='#ffffff'; ctx.fillRect(-3,-8,6,22); ctx.fillRect(-10,-2,20,6);
  ctx.fillStyle=knight.arch===ARCHETYPES.PRINCE?'#ffe082':'#cfd8dc';
  ctx.beginPath(); ctx.arc(-20,-6,9,0,Math.PI*2); ctx.arc(20,-6,9,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#78909c'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle=knight.arch===ARCHETYPES.PRINCE?'#ffecb3':'#90a4ae';
  ctx.beginPath(); ctx.arc(0,-32,18,Math.PI,0); ctx.lineTo(16,-14); ctx.lineTo(-16,-14); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#1c2833'; ctx.fillRect(-10,-32,20,4);

  if(knight.arch===ARCHETYPES.PRINCE){ ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.moveTo(-12,-40); ctx.lineTo(-12,-50); ctx.lineTo(-6,-44); ctx.lineTo(0,-52); ctx.lineTo(6,-44); ctx.lineTo(12,-50); ctx.lineTo(12,-40); ctx.closePath(); ctx.fill(); }
  else if(knight.arch===ARCHETYPES.BERSERKER){ ctx.fillStyle='#ff3d00'; ctx.beginPath(); ctx.moveTo(-14,-38); ctx.lineTo(-10,-50); ctx.lineTo(-4,-42); ctx.lineTo(0,-54); ctx.lineTo(4,-42); ctx.lineTo(10,-50); ctx.lineTo(14,-38); ctx.closePath(); ctx.fill(); }
  else{ ctx.fillStyle=tc; ctx.beginPath(); ctx.ellipse(0,-52,6,10,0,0,Math.PI*2); ctx.fill(); }

  // Triage badge
  ctx.save(); ctx.translate(0,-64);
  ctx.fillStyle='rgba(10,16,26,0.9)'; ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=tc; ctx.lineWidth=2.5; ctx.stroke();
  ctx.font='15px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(knight.type.icon,0,1); ctx.restore();
  ctx.restore();
}

function roundRect(c,x,y,w,h,r=8){ c.beginPath(); c.roundRect(x,y,w,h,r); }

// ─────────────────────────────────────────────────────────────
// INPUT
// ─────────────────────────────────────────────────────────────
const activeTouches=new Map();

function getXY(e){ const r=canvas.getBoundingClientRect(); return { x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height) }; }

canvas.addEventListener('pointerdown', e=>{
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  const pt=getXY(e);
  activeTouches.set(e.pointerId,{x:pt.x,y:pt.y,startX:pt.x,startY:pt.y,dragKnight:null});

  // HOME SCREEN
  if(gameState==='home'){
    if(pt.x>280&&pt.x<440&&pt.y>878&&pt.y<920){ soundOn=!soundOn; localStorage.setItem('sr_sound',soundOn?'1':'0'); playTone(520,'sine',0.1,0.1); return; }
    if(pt.x>100&&pt.x<620&&pt.y>462&&pt.y<534){ startGame('solo'); return; }
    if(pt.x>100&&pt.x<620&&pt.y>552&&pt.y<624){ playerRole='defender'; gameState='roleselect'; playTone(440,'triangle',0.1,0.08); return; }
    if(pt.x>100&&pt.x<620&&pt.y>642&&pt.y<714){ gameState='online'; onlineState='idle'; onlineStatus=''; roomCodeInput=''; roomCodeInputActive=false; playTone(440,'triangle',0.1,0.08); return; }
    if(pt.x>100&&pt.x<620&&pt.y>730&&pt.y<788){ gameState='howtoplay'; playTone(440,'triangle',0.1,0.08); return; }
    return;
  }

  // ROLE SELECT
  if(gameState==='roleselect'){
    if(pt.x>90&&pt.x<630&&pt.y>420&&pt.y<620){ playerRole='attacker'; startGame('vs'); return; }
    if(pt.x>90&&pt.x<630&&pt.y>640&&pt.y<860){ playerRole='defender'; startGame('vs'); return; }
    if(pt.x>220&&pt.x<540&&pt.y>885&&pt.y<935){ gameState='home'; return; }
    return;
  }

  // ONLINE SCREEN
  if(gameState==='online'){
    // HOST
    if(onlineState==='idle'&&pt.x>180&&pt.x<580&&pt.y>445&&pt.y<505){ onlineRole='defender'; playerRole='defender'; initPeer(); return; }
    // Join code input
    if(pt.x>160&&pt.x<560&&pt.y>668&&pt.y<716){ roomCodeInputActive=true; return; }
    // Virtual keyboard
    if(roomCodeInputActive){
      const cols=9;
      for(let i=0;i<KB_CHARS.length;i++){
        const col=i%cols, row=Math.floor(i/cols);
        const kx=18+col*(W-36)/cols, ky=840+row*58;
        const kw=(W-36)/cols-4;
        if(pt.x>kx&&pt.x<kx+kw&&pt.y>ky&&pt.y<ky+50){
          const c=KB_CHARS[i];
          if(c==='⌫') roomCodeInput=roomCodeInput.slice(0,-1);
          else if(roomCodeInput.length<6) roomCodeInput+=c;
          playTone(520,'sine',0.05,0.08); return;
        }
      }
      roomCodeInputActive=false; return;
    }
    // JOIN button
    if(pt.x>180&&pt.x<540&&pt.y>730&&pt.y<782){
      if(roomCodeInput.length>=4){ onlineRole='attacker'; playerRole='attacker'; joinPeer(roomCodeInput); }
      else { onlineStatus='Enter a valid room code first!'; }
      return;
    }
    if(pt.x>220&&pt.x<500&&pt.y>1020&&pt.y<1070){ gameState='home'; if(peer){try{peer.destroy();}catch(e){}} peer=null; conn=null; onlineState='idle'; return; }
    return;
  }

  // HOW TO PLAY
  if(gameState==='howtoplay'){ if(pt.x>160&&pt.x<560&&pt.y>990&&pt.y<1050){ gameState='home'; playTone(360,'triangle',0.1,0.08); } return; }

  // PAUSE
  if(gameState==='pause'){
    if(pt.x>140&&pt.x<580&&pt.y>490&&pt.y<555){ gameState='play'; playTone(520,'sine',0.1,0.1); return; }
    if(pt.x>140&&pt.x<580&&pt.y>575&&pt.y<637){ if(gameMode==='vs') startGame('vs'); else restartCurrentWave(); return; }
    if(pt.x>140&&pt.x<580&&pt.y>658&&pt.y<720){ gameState='home'; playTone(320,'sine',0.1,0.1); return; }
    if(pt.x>220&&pt.x<500&&pt.y>750&&pt.y<796){ soundOn=!soundOn; localStorage.setItem('sr_sound',soundOn?'1':'0'); return; }
    return;
  }

  // REWARD
  if(gameState==='reward'){
    rewardOptions.forEach((r,idx)=>{ const y=420+idx*140; if(pt.x>85&&pt.x<635&&pt.y>y&&pt.y<y+118) selectRelic(idx); });
    return;
  }

  // VICTORY / GAMEOVER
  if(gameState==='victory'||gameState==='gameover'){
    if(pt.x>120&&pt.x<600&&pt.y>695&&pt.y<769){ startGame(gameMode); return; }
    if(pt.y>802&&pt.y<860){ gameState='home'; return; }
    return;
  }

  // IN-GAME HUD
  if(pt.x>585&&pt.x<631&&pt.y>20&&pt.y<60){ soundOn=!soundOn; localStorage.setItem('sr_sound',soundOn?'1':'0'); return; }
  if(pt.x>642&&pt.x<688&&pt.y>20&&pt.y<60){ gameState='pause'; playTone(400,'sine',0.1,0.1); return; }

  // ATTACKER command bar (1v1 vs / online when local player is attacker)
  const showAttacker=(gameMode==='vs')||( gameMode==='online'&&playerRole==='attacker');
  if(showAttacker&&pt.y>=142&&pt.y<=200){
    const keys=['catapult','arrowVolley','ladderRush','plagueBomb','siegeTower','assassin'];
    keys.forEach((k,idx)=>{ const bx=26+idx*112; if(pt.x>=bx&&pt.x<=bx+105) triggerAttackerSkill(k); });
    return;
  }

  // Defender skills (only if not attacker in online)
  const isDefender=(gameMode!=='online')||(playerRole==='defender');
  if(isDefender){
    if(pt.x>18&&pt.x<114&&pt.y>600&&pt.y<644){ activateElixir(); return; }
    if(pt.x>122&&pt.x<218&&pt.y>600&&pt.y<644){ activateShield(); return; }
    if(pt.x>226&&pt.x<322&&pt.y>600&&pt.y<644){ activateRally(); return; }
    if(pt.x>330&&pt.x<426&&pt.y>600&&pt.y<644){ activateFortress(); return; }

    // Tap bed
    for(let bed of beds){
      if(Math.abs(pt.x-bed.x)<95&&Math.abs(pt.y-bed.y)<125){
        if(!bed.patient&&selectedQueueKnight){
          if(bed.type===selectedQueueKnight.type){
            bed.patient=selectedQueueKnight; bed.treatProgress=0; bed.isHealing=false;
            selectedQueueKnight.inBed=bed;
            queueKnights=queueKnights.filter(k=>k!==selectedQueueKnight); selectedQueueKnight=null;
            vibrate(25); playTone(520,'triangle',0.15,0.1,740);
            createParticles(bed.x,bed.y,bed.type.color,14);
            addFloatingText(bed.x,bed.y-40,'PLACED! TAP TO HEAL','#ffffff',18);
          } else { addFloatingText(bed.x,bed.y-40,'WRONG WARD!','#ff5252',20); playTone(140,'sawtooth',0.2,0.12); }
          return;
        }
        if(bed.patient&&!assassinActive){
          bed.isHealing=true; bed.treatProgress+=0.38*perks.healMult; vibrate(15);
          playTone(480+bed.idx*120,'triangle',0.1,0.08);
          // Purse tap on cursed knight gives immediate purification progress
          if(bed.patient&&!bed.patient.isPurified){ bed.patient.isPurified=true; createParticles(bed.x,bed.y,'#b388ff',15); addFloatingText(bed.x,bed.y-40,'✨ PURIFIED!','#b388ff',20); }
          if(tutorialStep===2) tutorialStep=0;
          return;
        }
      }
    }

    // Tap/drag queue knight
    const aq=queueKnights.filter(k=>!k.dragged&&!k.inBed);
    for(let knight of aq){
      if(Math.abs(pt.x-knight.x)<75&&Math.abs(pt.y-knight.y)<95){
        selectedQueueKnight=(selectedQueueKnight===knight)?null:knight;
        knight.dragged=true;
        const t=activeTouches.get(e.pointerId); if(t) t.dragKnight=knight;
        vibrate(15); playTone(360,'sine',0.08,0.06);
        if(tutorialStep===1) tutorialStep=2;
        return;
      }
    }
  }

  if(pt.y>960) selectedQueueKnight=null;
});

canvas.addEventListener('pointermove',e=>{
  const t=activeTouches.get(e.pointerId);
  if(t){ const p=getXY(e); t.x=p.x; t.y=p.y; }
});

canvas.addEventListener('pointerup',e=>{
  const t=activeTouches.get(e.pointerId);
  if(t){
    const pt=getXY(e);
    if(t.dragKnight){
      const knight=t.dragKnight; knight.dragged=false;
      let dropped=null;
      for(let bed of beds){ if(Math.abs(pt.x-bed.x)<100&&Math.abs(pt.y-bed.y)<130){ dropped=bed; break; } }
      if(dropped){
        if(!dropped.patient&&dropped.type===knight.type){
          dropped.patient=knight; dropped.treatProgress=0; dropped.isHealing=false;
          knight.inBed=dropped; queueKnights=queueKnights.filter(k=>k!==knight); selectedQueueKnight=null;
          vibrate(25); playTone(520,'triangle',0.15,0.1,740);
          createParticles(dropped.x,dropped.y,knight.type.color,14);
          addFloatingText(dropped.x,dropped.y-40,'PLACED!','#ffffff',18);
        } else { addFloatingText(dropped.x,dropped.y-40,dropped.patient?'BED OCCUPIED!':'WRONG WARD!','#ff5252',20); playTone(140,'sawtooth',0.2,0.12); }
      }
    }
  }
  beds.forEach(b=>{ b.isHealing=false; });
  activeTouches.delete(e.pointerId);
});

canvas.addEventListener('pointercancel',e=>{
  const t=activeTouches.get(e.pointerId); if(t&&t.dragKnight) t.dragKnight.dragged=false;
  beds.forEach(b=>{ b.isHealing=false; }); activeTouches.delete(e.pointerId);
});

// ─────────────────────────────────────────────────────────────
// GAME LOOP
// ─────────────────────────────────────────────────────────────
let lastTime=performance.now();
function gameLoop(now){
  const dt=Math.min(0.05,(now-lastTime)/1000); lastTime=now;
  update(dt); draw();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

// Service Worker
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}

})();
</script>
