<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e2c3d"/>
      <stop offset="100%" stop-color="#090e15"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe57f"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c6d1f"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- App Rounded Icon Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6"/>

  <!-- Medieval Castle Battlement Ramparts -->
  <path d="M 64 360 L 64 260 L 110 260 L 110 290 L 150 290 L 150 260 L 195 260 L 195 290 L 235 290 L 235 260 L 277 260 L 277 290 L 317 290 L 317 260 L 362 260 L 362 290 L 402 290 L 402 260 L 448 260 L 448 360 Z" fill="#263238" stroke="#37474f" stroke-width="4"/>

  <!-- Heraldic Shield Base -->
  <path d="M 256 70 Q 380 70 395 190 Q 395 330 256 425 Q 117 330 117 190 Q 132 70 256 70 Z" fill="#131c26" stroke="url(#goldGrad)" stroke-width="14" filter="url(#glow)"/>

  <!-- Inner Shield Trim -->
  <path d="M 256 90 Q 360 90 374 195 Q 374 315 256 400 Q 138 315 138 195 Q 152 90 256 90 Z" fill="#0d141e" stroke="#2a3b50" stroke-width="4"/>

  <!-- Triage Medical Cross -->
  <path d="M 226 130 H 286 V 215 H 371 V 275 H 286 V 360 H 226 V 275 H 141 V 215 H 226 Z" fill="url(#redGrad)" stroke="#ffebee" stroke-width="4" filter="url(#glow)"/>

  <!-- Central Gold Starburst -->
  <polygon points="256,195 262,235 302,241 262,247 256,287 250,247 210,241 250,235" fill="url(#goldGrad)"/>

  <!-- Crossed Knight Swords in Background -->
  <circle cx="256" cy="442" r="14" fill="url(#goldGrad)"/>
</svg>
